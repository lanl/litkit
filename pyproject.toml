[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litkit"
version = "0.3.31"
description = "Literature tooling: ingest, embed, index, answer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "William S. Hlavacek", email = "hlavacek@lanl.gov" }]

# Advertise supported operating systems (informational)
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: MacOS :: MacOS X",
]

[project.optional-dependencies]
gpu = ["torch", "transformers"]
index = ["faiss-cpu"]
dev = ["black", "ruff", "mypy", "pytest"]
all = ["torch", "transformers", "faiss-cpu"]

[project.scripts]
litkit = "litkit.cli:main"

[project.urls]
"Repository" = "https://github.com/lanl/litkit"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["litkit*"]

# Formatting / linting
[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true
unsafe-fixes = false
src = ["src", "tests"]
exclude = [".venv", "build", "dist", ".eggs", "*.egg-info", "workspace"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]  # Add "D" later.
ignore = ["E501", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["D"]
"src/litkit/cli.py" = ["E402", "B006", "B008", "B023"]

# Disclosure
[tool.litkit.ai_assistance]
used = true
models = ["ChatGPT"]
scope = ["refactoring", "docs", "packaging"]
human_reviewed = true