name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux ARM64
            runner: ubuntu-24.04-arm
          - platform: macOS ARM64
            runner: macos-15
          - platform: Windows x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.8"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Windows dependencies from binary wheels
        if: runner.os == 'Windows'
        run: uv sync --locked --no-install-project --no-build
      - run: uv sync --locked --no-editable
      - run: uv run --no-sync litkit --version
      - run: uv run --no-sync pytest
      - name: Build and reopen an index with the installed CPU embedders
        if: runner.os == 'Windows'
        run: uv run --no-sync pytest -m slow tests/integration/test_cpu_install.py
